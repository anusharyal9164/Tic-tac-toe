<!-- Multi-player Tic-Tac-Toe Game -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Two Player Tic Tac Toe - Anush Aryal</title>
    <link rel="stylesheet" href="Tic-Tac-Toe.css">
</head>
<body>
    <h1>Two Player Tic Tac Toe</h1>

    <div id="login-container">
        <input type="text" id="username" placeholder="Username" value="Joe">
        <input type="password" id="password" placeholder="Password">
        <button id="joinBtn">Join Game</button>
    </div>

    <div id="loginStatus">Not logged in</div>
    <div id="status">Waiting for players...</div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div>
        <button id="resetBtn">Reset Game</button>
    </div>

    <script src="client.js"></script>
</body>
</html>
